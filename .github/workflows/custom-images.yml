# Builds this fork's Plane images and pushes them to GHCR.
#
# Images (mirroring the official makeplane/* names):
#   ghcr.io/<owner>/plane-admin | plane-frontend | plane-space | plane-live | plane-backend | plane-proxy
#
# Tags:
#   push to `custom`          -> :custom, :sha-<short>
#   push tag `custom-v*`      -> :<tag>  (e.g. custom-v1.5.0-1), use these for Coolify releases
#   manual run                -> :<branch>, :sha-<short>
#
# The server is x86_64, so only linux/amd64 is built. Add linux/arm64 to PLATFORMS if needed.

name: Custom images

on:
  push:
    branches:
      - custom
    tags:
      - "custom-v*"
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated images to build (admin,frontend,space,live,backend,proxy) or 'all'"
        required: false
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          REQUESTED: ${{ github.event.inputs.images || 'all' }}
        run: |
          ALL='[
            {"name":"admin","context":".","dockerfile":"./apps/admin/Dockerfile.admin"},
            {"name":"frontend","context":".","dockerfile":"./apps/web/Dockerfile.web"},
            {"name":"space","context":".","dockerfile":"./apps/space/Dockerfile.space"},
            {"name":"live","context":".","dockerfile":"./apps/live/Dockerfile.live"},
            {"name":"backend","context":"./apps/api","dockerfile":"./apps/api/Dockerfile.api"},
            {"name":"proxy","context":"./apps/proxy","dockerfile":"./apps/proxy/Dockerfile.ce"}
          ]'
          if [ "$REQUESTED" = "all" ] || [ -z "$REQUESTED" ]; then
            MATRIX=$(echo "$ALL" | jq -c .)
          else
            MATRIX=$(echo "$ALL" | jq -c --arg r "$REQUESTED" '($r | split(",") | map(gsub("\\s";""))) as $want | map(select(.name as $n | $want | index($n)))')
          fi
          if [ "$MATRIX" = "[]" ]; then echo "No matching images for '$REQUESTED'" >&2; exit 1; fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: plane-${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/plane-${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=plane-${{ matrix.image.name }}
            org.opencontainers.image.licenses=AGPL-3.0

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=plane-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=plane-${{ matrix.image.name }}
